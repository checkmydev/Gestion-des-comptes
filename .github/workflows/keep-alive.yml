name: Keep-alive Supabase

# Un projet Supabase gratuit est mis en pause après 7 jours sans activité.
# Ce workflow écrit une ligne dans la table keep_alive tous les 3 jours
# (sans effet sur les comptes), même si l'application n'est pas ouverte.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de keep_alive()
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Content-Profile: comptes" \
            -d '{"source":"github"}'
